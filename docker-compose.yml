services:
  mongodb:
    image: mongo:7
    container_name: social-analytics-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-admin_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-social_analytics}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: social-analytics-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j_password} 'RETURN 1' || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: social-analytics-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_PORT:-9094}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: social-analytics-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: social-analytics-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-analytics-bootstrap
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin_password}@mongodb:27017/${MONGO_DATABASE:-social_analytics}?authSource=admin"
      MONGO_DATABASE: ${MONGO_DATABASE:-social_analytics}
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
    volumes:
      - ./schema:/app/schema
      - ./src:/app/src
    command: ["sh", "-c", "python -m src.init_mongodb && python -m src.init_neo4j"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-analytics-python
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin_password}@mongodb:27017/${MONGO_DATABASE:-social_analytics}?authSource=admin"
      MONGO_DATABASE: ${MONGO_DATABASE:-social_analytics}
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_ACTIVITY_TOPIC: ${KAFKA_ACTIVITY_TOPIC:-activity-events}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_SOURCE_SERVICE: ${KAFKA_SOURCE_SERVICE:-social-analytics-api}
    volumes:
      - ./data:/app/data
      - ./schema:/app/schema
      - ./src:/app/src
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-analytics-dashboard
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin_password}@mongodb:27017/${MONGO_DATABASE:-social_analytics}?authSource=admin"
      MONGO_DATABASE: ${MONGO_DATABASE:-social_analytics}
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
    volumes:
      - ./src:/app/src
      - ./visualisation:/app/visualisation
    command:
      [
        "streamlit",
        "run",
        "visualisation/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
      ]

  activity-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-analytics-activity-consumer
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin_password}@mongodb:27017/${MONGO_DATABASE:-social_analytics}?authSource=admin"
      MONGO_DATABASE: ${MONGO_DATABASE:-social_analytics}
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_ACTIVITY_TOPIC: ${KAFKA_ACTIVITY_TOPIC:-activity-events}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_SOURCE_SERVICE: ${KAFKA_SOURCE_SERVICE:-social-analytics-api}
    volumes:
      - ./src:/app/src
    command: ["python", "-m", "src.kafka_activity_consumer"]

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-analytics-realtime-simulator
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      SIMULATOR_API_BASE_URL: "http://app:8000"
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-3}
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-admin_password}@mongodb:27017/${MONGO_DATABASE:-social_analytics}?authSource=admin"
      MONGO_DATABASE: ${MONGO_DATABASE:-social_analytics}
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_ACTIVITY_TOPIC: ${KAFKA_ACTIVITY_TOPIC:-activity-events}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_SOURCE_SERVICE: ${KAFKA_SOURCE_SERVICE:-social-analytics-api}
    volumes:
      - ./src:/app/src
    command: ["python", "-m", "src.realtime_activity_simulator"]

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  kafka_data:
